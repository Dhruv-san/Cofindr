<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple WebRTC Video Call</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Simple WebRTC Video Call</h1>

    <div>
        <label for="roomName">Room Name:</label>
        <input type="text" id="roomName" name="roomName" placeholder="Enter a room name">
    </div>

    <div id="statusMessages" class="status">
        <!-- Status messages will appear here -->
    </div>

    <div class="video-container">
        <div>
            <h2>Local Video</h2>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div>
            <h2>Remote Video</h2>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <div class="controls">
        <button id="startCall">Start Call</button>
        <button id="endCall">End Call</button>
        <button id="muteAudio">Mute Audio</button>
        <button id="muteVideo">Mute Video</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
